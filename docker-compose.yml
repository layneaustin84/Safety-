# docker compose --profile download run --rm download   # fetch weights once
# docker compose up llama-server                        # serve
# docker compose run --rm client chat "hello"           # talk to it
services:
  download:
    profiles: ["download"]
    image: python:3.12-slim
    env_file: .env
    working_dir: /work
    volumes:
      - ${MODELS_DIR:-./models}:/models
      - ./scripts:/work/scripts:ro
    environment:
      MODELS_DIR: /models
    entrypoint: ["/bin/bash", "-c"]
    command:
      - pip install -q -U huggingface_hub && scripts/download-model.sh

  llama-server:
    # CUDA build of llama-server. Swap the tag for :server (CPU) or
    # :server-vulkan / :server-rocm as your hardware requires.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    env_file: .env
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    # LLAMA_ARG_* env vars are read natively by llama-server.
    environment:
      LLAMA_ARG_MODEL: /models/${MODEL_FILE:-Qwen3.8-27B-Uncensored-Q4_K_M.gguf}
      LLAMA_ARG_MMPROJ: ${MMPROJ_FILE:+/models/${MMPROJ_FILE}}
      LLAMA_ARG_ALIAS: ${LLAMA_ALIAS:-qwen3.8-27b-uncensored}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-99}
      LLAMA_ARG_N_PARALLEL: ${LLAMA_PARALLEL:-1}
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_JINJA: "1"
      LLAMA_ARG_THINK: deepseek
      LLAMA_ARG_SPEC_TYPE: ${LLAMA_SPEC_TYPE:-draft-mtp}
      LLAMA_ARG_SPEC_DRAFT_N_MAX: ${LLAMA_SPEC_DRAFT_N_MAX:-2}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  client:
    build:
      context: ./client
    env_file: .env
    environment:
      QWEN_BASE_URL: http://llama-server:8080/v1
      QWEN_API_KEY: ${LLAMA_API_KEY:-}
      QWEN_MODEL: ${LLAMA_ALIAS:-qwen3.8-27b-uncensored}
    depends_on:
      llama-server:
        condition: service_healthy
    stdin_open: true
    tty: true
