[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qwen-client"
version = "0.1.0"
description = "OpenAI-compatible client and CLI for Qwen3.8-27B-Uncensored served by llama.cpp"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "openai>=1.50,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
qwen = "qwen_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["qwen_client"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
