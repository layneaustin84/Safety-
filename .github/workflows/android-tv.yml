name: Android TV toolkit

on:
  push:
    paths: ['android-tv/**', '.github/workflows/android-tv.yml']
  pull_request:
    paths: ['android-tv/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S warning android-tv/tv.sh android-tv/lib/*.sh android-tv/test/run.sh
      - name: Round-trip test against mock adb
        run: android-tv/test/run.sh

  launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint release APK
        run: ./gradlew --no-daemon lintRelease assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk minimal-tv-home.apk
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-tv-home
          path: android-tv/launcher/minimal-tv-home.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android-tv/launcher/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
